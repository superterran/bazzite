# Native OpenSSH >=9.8 per-source penalties (sshd 10.2 here).
# Replaces the need for fail2ban: sshd itself refuses connections from sources
# that keep failing, with escalating backoff. No extra package on an
# rpm-ostree immutable base, and it survives image updates.
#
# Defaults were authfail:5 noauth:1 min:15 max:600. These are ~4x stiffer.
PerSourcePenalties authfail:20s noauth:40s grace-exceeded:40s refuseconnection:5m crash:5m min:60s max:1h

# Cap concurrent unauthenticated connections per source (bots open many at once).
PerSourceMaxStartups 10

# Never penalise ourselves: LAN, plus our own WAN IP (NAT hairpin makes Doug's
# own remote sessions arrive from it). Update if the Xfinity WAN IP changes.
PerSourcePenaltyExemptList 10.0.0.0/24,24.11.182.23

# Global unauthenticated-connection throttle: start dropping at 10, 100% by 30.
MaxStartups 10:50:30
