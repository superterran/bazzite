# AIO / CPU thermal alarms — added 2026-06-03 after repeated thermal lockups.
# Root cause was a quiet fan curve starving the radiator (see bazzite repo
# bin/fan-curve.sh). These watch for the runaway signature, not normal heat:
# a 9950X hits 95C by design under load, so we only alarm on SUSTAINED pinning.

 alarm: cpu_tctl_pinned
    on: sensors.temperature_k10temp-pci-00c3_temp1_Tctl_input
 class: Errors
  type: System
component: CPU
  lookup: average -2m unaligned of input
   units: degrees Celsius
   every: 10s
    warn: $this > 90
    crit: $this > 96
   delay: down 5m multiplier 1.5 max 1h
    info: CPU Tctl pinned near Tjmax for 2m (coolant may be running away)
      to: sysadmin

 alarm: aio_pump_stopped
    on: sensors.fan_nct6799-isa-0290_fan7_input
 class: Errors
  type: System
component: Cooling
  lookup: average -30s unaligned of input
   units: rpm
   every: 10s
    crit: $this < 500
   delay: down 1m
    info: AIO pump RPM near zero - STOP LOAD, coolant not circulating
      to: sysadmin
