#--- bazzite thermal Slack notifier (appended 2026-06-03) ---
# Posts alarms as a DM via chat.postMessage using the reused OpenClaw bot token.
# Last-definition-wins overrides the stock SEND_CUSTOM stub above.
SEND_CUSTOM="YES"
DEFAULT_RECIPIENT_CUSTOM="thermal"

custom_sender() {
    [ -r /etc/netdata/slack-thermal.env ] && . /etc/netdata/slack-thermal.env
    [ -z "${SLACK_BOT_TOKEN:-}" ] && return 1
    local chan="${SLACK_TARGET}" emoji
    case "${status}" in
        CRITICAL) emoji="🔴" ;;
        WARNING)  emoji="🟠" ;;
        CLEAR)    emoji="✅" ;;
        *)        emoji="ℹ️" ;;
    esac
    local text="${emoji} bazzite ${status}: ${name}
${value_string}  (${chart})
${info}"
    curl -sS -m 10 -X POST https://slack.com/api/chat.postMessage \
        --data-urlencode "token=${SLACK_BOT_TOKEN}" \
        --data-urlencode "channel=${chan}" \
        --data-urlencode "text=${text}" \
        --data-urlencode "unfurl_links=false" >/dev/null 2>&1
}

#--- thermal role mapping override (must come after stock role_recipients_* arrays) ---
role_recipients_custom[sysadmin]="thermal"
role_recipients_email[sysadmin]="disabled"
