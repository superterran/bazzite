# vkms — Virtual Kernel Mode Setting (software DRM connector for Sunshine streaming)
#
# Provides card2-Virtual-1: a real, KMS-capturable DRM connector independent of the
# physical TV on HDMI-A-2. Used for streaming ultrawide / iPad aspect ratios via Sunshine.
#
# NOT deployed to /etc/modules-load.d/ by default — Phase 2 of the EDID/streaming work
# (see Handoffs/2026-06-04-edid-force-headless-streaming.md) is still choosing between
# this and the all-NVIDIA "forced EDID on spare DP-2" approach. Load on demand with
# `bin/vkms-virtual-display.sh` while testing. Deploy this file only once vkms is the
# committed path (then it auto-loads at boot via systemd-modules-load).
vkms
