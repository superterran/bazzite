# Make the NEXT hang leave a fingerprint instead of going silent. 2026-06-06.
#
# A soft lockup (a CPU stuck spinning) is exactly the failure class we're chasing.
# Turning it into a panic means it gets logged (and, with panic=, auto-recovers)
# instead of leaving the box wedged. hung_task_panic is deliberately left OFF —
# a task stuck in D-state (USB/NFS) is a different, more false-trip-prone signal.
kernel.softlockup_panic = 1
kernel.panic_on_oops = 1
kernel.panic = 10
