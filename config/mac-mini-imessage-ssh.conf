# Restricted service identity; administration uses the separate mac-mini alias.
Host mac-mini-imessage
  HostName 10.0.0.92
  User superterran
  IdentityFile ~/.ssh/imessage_mini_ed25519
  IdentityAgent none
  IdentitiesOnly yes
  AddressFamily inet
  HostKeyAlias fleet-mac-mini
  UserKnownHostsFile ~/.ssh/fleet-known-hosts
  StrictHostKeyChecking yes
  ForwardAgent no
  ConnectTimeout 8
  ServerAliveInterval 15
  ServerAliveCountMax 3
  BatchMode yes
Host *
