# Appended on every launch by bin/launch-shared-retroarch.py.
# PS/Guide belongs to Steam only; "hold Start for 2 seconds" pauses and opens a short menu.
joypad_autoconfig_dir = "@RA_DIR@/autoconfig-family"
input_menu_toggle_gamepad_combo = "7"
# Steam Input exposes a virtual pad AND the raw controller; with two users the raw pad
# became player 2, so coin/start began 2-player games (Ms. Pac-Man "dots come back").
input_max_users = "1"
menu_pause_libretro = "true"
quit_on_close_content = "1"
quit_press_twice = "false"
quick_menu_show_resume_content = "true"
quick_menu_show_restart_content = "true"
quick_menu_show_close_content = "true"
quick_menu_show_save_load_state = "true"
quick_menu_show_savestate_submenu = "false"
quick_menu_show_undo_save_load_state = "false"
quick_menu_show_take_screenshot = "false"
quick_menu_show_add_to_favorites = "false"
quick_menu_show_add_to_playlist = "false"
quick_menu_show_cheats = "false"
quick_menu_show_controls = "false"
quick_menu_show_core_options_flush = "false"
quick_menu_show_download_thumbnails = "false"
quick_menu_show_information = "false"
quick_menu_show_options = "false"
quick_menu_show_replay = "false"
quick_menu_show_reset_core_association = "false"
quick_menu_show_set_core_association = "false"
quick_menu_show_save_content_dir_overrides = "false"
quick_menu_show_save_core_overrides = "false"
quick_menu_show_save_game_overrides = "false"
quick_menu_show_shaders = "false"
quick_menu_show_start_recording = "false"
quick_menu_show_start_streaming = "false"
# Borders/bezels never draw over the pause menu.
input_overlay_hide_in_menu = "true"
# Saves sync through Syncthing only; RetroArch cloud sync stays off on every launch.
cloud_sync_enable = "false"
