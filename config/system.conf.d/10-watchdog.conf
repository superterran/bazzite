# Wire systemd to the SP5100 hardware watchdog.
#
# This box has hard-frozen at idle (cold, log-less, no panic) — a class of hang
# the kernel can't recover from on its own. The hardware watchdog auto-reboots
# the machine ~1 min after systemd stops petting it, so a freeze costs a reboot
# instead of an 8-hour-dead box. Added 2026-06-06 (idle-freeze fix).
[Manager]
RuntimeWatchdogSec=60s
RebootWatchdogSec=2min
