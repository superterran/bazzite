# Sunshine configuration — bazzite-desktop (brew-native, KMS mirror)
# Restored 2026-06-06 after the Flatpak swap broke KMS capture.
# brew-native binary has CAP_SYS_ADMIN (via /usr/libexec/sunshine-postinst),
# so it CAN do KMS capture. The Flatpak CANNOT — do not switch back to it.

# --- Encoding ---
encoder = nvenc

# --- GPU pin (multi-GPU box: RTX 4070 + 9950X iGPU) ---
# Display/connector 821 lives on the NVIDIA card (card2 / renderD129, pci 01:00.0).
# Without pinning, Sunshine bound its encoder EGL context to the AMD iGPU
# (renderD128 / amdgpu) and the cross-GPU frame import failed with
# EGL_BAD_MATCH (0x3009) -> no frames -> Moonlight "Connection Terminated -1".
# Pin both KMS capture and NVENC to the NVIDIA render node.
adapter_name = /dev/dri/renderD129

# --- Display capture ---
# KMS captures the active framebuffer on whatever connector gamescope drives
# (--prefer-output HDMI-A-2), i.e. it MIRRORS the TV. No output_name needed
# while gamescope drives a single connector.
capture = kms

# --- Misc ---
# No system tray under the gamescope session.
system_tray = disabled

# --- stream resilience tuning: wifi-extender backhaul + iPad-on-wifi path (added 2026-06-12) ---
# Higher FEC = recover dropped packets without a visible hitch (default 20).
fec_percentage = 30
# Keep encode latency low so the host isn't adding to the network jitter.
nvenc_twopass = disabled
