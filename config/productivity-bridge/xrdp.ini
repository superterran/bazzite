[Globals]
ini_version=1
fork=true
port=tcp://100.119.114.55:3391
security_layer=tls
crypt_level=high
certificate=/etc/xrdp/productivity-tls.crt
key_file=/etc/xrdp/productivity-tls.key
ssl_protocols=TLSv1.2, TLSv1.3
autorun=GNOME
allow_channels=true
allow_multimon=true
max_bpp=32
use_fastpath=both
bitmap_cache=true
bitmap_compression=true
bulk_compression=true
tcp_nodelay=true

[Logging]
LogFile=/dev/stdout
LogLevel=INFO
EnableSyslog=false

[Channels]
rdpdr=true
rdpsnd=false
drdynvc=true
cliprdr=true
rail=false
xrdpvr=false

[GNOME]
name=Independent GNOME desktop
lib=libvnc.so
ip=127.0.0.1
port=5903
username=na
password=ask
