# bazzite-desktop is a 24/7 gaming + dev server (Ollama, cloudflared tunnel, MCP,
# remote control). s2idle resume is broken on this AMD 9950X + RTX 4070 hardware, so
# any suspend = a dead machine until a hard reset.
#
# This overrides Bazzite's deck.conf, which ships HandlePowerKey=suspend. Drop-ins are
# read in lexical order and the LAST value wins; digits sort BEFORE letters, so the file
# MUST be named to sort after "deck.conf" -> hence the "zz-" prefix (a "99-" prefix does
# NOT work and silently loses to deck.conf).
#
# Installed + sleep targets masked by desktop.d/disable-suspend.sh.
[Login]
HandlePowerKey=poweroff
HandleSuspendKey=ignore
HandleHibernateKey=ignore
HandleLidSwitch=ignore
