Section "ServerFlags"
 Option "AutoAddGPU" "false"
 Option "AutoAddDevices" "true"
 Option "DontVTSwitch" "true"
EndSection
Section "Device"
 Identifier "BrowserDummy"
 Driver "dummy"
 VideoRam 256000
EndSection
Section "Monitor"
 Identifier "BrowserMonitor"
 HorizSync 30-90
 VertRefresh 30-90
 Modeline "1920x1080" 148.5 1920 2008 2052 2200 1080 1084 1089 1125 +HSync +VSync
EndSection
Section "Screen"
 Identifier "BrowserScreen"
 Device "BrowserDummy"
 Monitor "BrowserMonitor"
 DefaultDepth 24
 SubSection "Display"
  Depth 24
  Modes "1920x1080"
 EndSubSection
EndSection
Section "InputClass"
 Identifier "Private browser input"
 MatchProduct "seat-browser"
 MatchDevicePath "/dev/input/event*"
 Driver "libinput"
EndSection
